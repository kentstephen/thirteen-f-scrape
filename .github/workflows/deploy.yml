name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies and fetch data
        run: |
          pip install uv
          uv sync
          uv run thirteenf-fetch
        env:
          USER_AGENT: "thirteen-f-scrape github-actions (github.com/kentstephen/thirteen-f-scrape)"

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build Evidence sources
        run: npm run sources
        working-directory: dashboard

      - name: Build static site
        run: npm run build
        working-directory: dashboard

      - name: Add .nojekyll
        run: touch dashboard/build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
