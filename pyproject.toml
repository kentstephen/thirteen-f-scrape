[project]
name = "thirteen-f-scrape"
version = "0.1.0"
description = "SEC EDGAR 13F filings scraper + dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "httpx",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
pipeline = [
    "dagster",
    "dagster-webserver",
    "dagster-duckdb",
]

[project.scripts]
thirteenf-fetch = "thirteen_f_scrape.fetch:fetch_all"
thirteenf-report = "thirteen_f_scrape.report:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thirteen_f_scrape"]
